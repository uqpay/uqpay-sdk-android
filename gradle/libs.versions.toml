[versions]
# SDK artifact version — single source of truth (see docs/release-process.md)
uqpaySdk = "0.1.0-SNAPSHOT"
# Maven coordinates. The group is the namespace UQPAY owns on Maven Central (verified under
# the company Central Portal account) — the same one the Java server SDK publishes under.
uqpaySdkGroup = "com.uqpay.sdk"
uqpaySdkArtifact = "uqpay-sdk-android"

agp = "8.7.3"
# Publishing to the Central Portal (Maven Central). Wraps maven-publish + signing and talks
# the Portal publisher API, which plain maven-publish cannot.
mavenPublish = "0.33.0"
kotlin = "2.1.0"
compileSdk = "35"
minSdk = "24"
targetSdk = "35"

# DEPENDENCY VERSIONS HERE ARE FLOORS, NOT PREFERENCES.
#
# Every version below is imposed on every merchant app that integrates this SDK, and each
# androidx artifact carries a `minCompileSdk` that becomes a hard build requirement for
# them. `androidx.core:core-ktx:1.15.0` requires compileSdk 35; at that version a merchant
# app on compileSdk 34 — an app that simply has not been re-tooled in the last year —
# cannot build at all, with an error that names androidx rather than us.
#
# So we declare the *lowest* version that does the job and let Gradle raise it: a merchant
# already on core-ktx 1.15 or newer resolves to theirs (highest wins) and nothing changes
# for them, while a merchant on 34 can still build. Picking "latest" here buys us nothing
# and costs them their build.
#
# Measured minCompileSdk of what we depend on (2026-08-20):
#   core-ktx 1.13.1 -> 34   ·   core-ktx 1.15.0 -> 35
#   activity 1.9.3  -> 34   ·   lifecycle 2.8.7 -> 34   ·   Compose 1.7.6 -> 34
# 34 is therefore the floor, and core-ktx was the only thing above it. The SDK does not
# import androidx.core at all; it is declared so the floor is ours to choose rather than
# whatever `activity` happens to depend on this month.
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.3"
# Test-only. The SDK does not depend on androidx.fragment and must not: the Fragment host
# path works through androidx.activity's ActivityResultCaller, which Fragment implements.
# This is here so JavaConsumerApiTest can actually stand a Fragment up and prove that.
fragment = "1.8.5"
lifecycle = "2.8.7"

# Compose is the payment UI toolkit (D3). Versions are a deliberate conservative floor:
# BOM 2024.12.01 pins Compose 1.7.6 / Material3 1.3.1, the last 1.7 line, which was
# built against Kotlin 2.0/2.1 and compileSdk 35 and predates the Kotlin 2.1.0 release
# we are on. Bumping the BOM later is safe; going lower is not (Compose < 1.7 predates
# the K2 compiler plugin). The Compose compiler ships inside Kotlin since 2.0, so the
# plugin version is `kotlin`, not a separate number. Compose types must never appear
# in the public API — `apiCheck` enforces that.
composeBom = "2024.12.01"

# Networking is deliberately dependency-free: raw HttpsURLConnection, as both
# stripe-android and airwallex-payment-android do. No OkHttp/Retrofit/Gson — a payment
# SDK must not force a transitive version conflict on a merchant app.
coroutines = "1.9.0"
kotlinxSerialization = "1.7.3"

# Freezes the public API surface: `apiCheck` fails the build on an undeclared change.
# The surface is a permanent compatibility commitment, so it is enforced by CI rather
# than by review.
binaryCompatibility = "0.16.3"

junit = "4.13.2"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.14.1"
mockk = "1.13.13"
turbine = "1.2.0"
androidxTestCore = "1.6.1"
archCoreTesting = "2.2.0"
leakcanary = "2.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Compose — versions come from the BOM; only the BOM carries a version. activity-compose
# and the lifecycle-compose artifacts track the existing `activity` / `lifecycle` versions
# so the SDK ships one version of each library, not two.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }

leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Parcelable is implemented by hand in the public models — no parcelize plugin needed.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Kotlin 2.x bundles the Compose compiler; its version is the Kotlin version by definition.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibility" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
